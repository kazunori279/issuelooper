# issuelooper settings for the Live AI Concierge sample: FastAPI and plain JS, with a
# live voice/text mode on the Gemini Live API and a scripted mode that needs no
# credentials. These are the settings of the 12-hour benchmark runs, on Gemini 4 Argon.
#
# Each key sets the environment variable named beside it, unless that variable is
# already exported (the environment wins). `python3 .claude/hooks/config.py check`
# lists what this file sets and any key it does not recognize.

[agents]
cli = "agy"                  # CCROLE_CLI: the agent CLI for every role, "agy" or "claude"
model = "gemini-4-argon-high"   # CCROLE_MODEL: the model for every role; empty = the CLI's default

# One role on another CLI or model: [agents.<role>] with cli and/or model.
# Roles: worker, merger, tester, monitor, reviewer, aide.
# [agents.monitor]
# cli = "claude"
# [agents.reviewer]
# model = "..."

[monitor]
host = "herdr"               # POOL_MONITOR_HOST: "herdr" (the monitor and aides in herdr panes you talk to)
                             # or "broker" (a headless monitor reached with `issuelooper say`)

[dashboard]
enabled = true               # ISSUELOOPER_DASHBOARD: `issuelooper start` also serves the dashboard on 127.0.0.1
port = 8780                  # ISSUELOOPER_DASHBOARD_PORT: the first port tried; the next free one up to +9 is used

[sweep]
command = "make verify"      # SWEEP_COMMAND: the whole check suite, run in a worktree
slots = 4                    # SWEEP_SLOTS: sweeps that may run at the same time (the main check below runs
                             # in a lane of its own, beside these). Not more: this suite drives a browser, and
                             # its e2e tests already flaked under the load of four sweeps and sixteen sessions
affected = "make lint && uv run pytest -q -p no:cacheprovider tests/unit {tests}"
                             # SWEEP_AFFECTED: lint, every unit test, and the tests the change touches
format = "uv run ruff format src tests"   # SWEEP_FORMAT: run first by agents' sweeps (the lint step's scope)
rerun = "uv run pytest -q -p no:cacheprovider {tests}"   # SWEEP_RERUN: the failing tests alone, for a second try
junit = true                 # SWEEP_JUNIT: each pytest run in a sweep writes a junit XML beside sweep/runs.jsonl
fast_command = "uv sync --frozen -q && uv run python -c 'import concierge.main' && uv run pytest -q -x -p no:cacheprovider tests/unit"
                             # POOL_FAST_CHECK_CMD: a quick check (seconds to a minute: the app imports, the unit
                             # tests pass) run before a merge on a pull request that is behind main, merged with
                             # main; a failure hands it back. Runs in a fresh worktree, so it sets up what it needs.
                             # Empty = no such check
main_check = true            # POOL_MAIN_CHECK: after main moves, run the whole suite on the newest main in the
                             # background; a red main files a `main is red` issue (P0), closed when it is green again

[deploy]
command = "bash .issuelooper/deploy.sh"   # POOL_DEPLOY_CMD: run from the shared checkout after main moves; empty = no deploys
                             # deploy.sh serves main on :8000 (scripted) and :8001 (live, with .env) for you to try

[live]
enabled = true               # POOL_LIVE: needs:live issues get a tester's live check after their merge

[devcheck]
enabled = true               # POOL_DEVCHECK: before the PR, a worker runs the app from its branch in live mode and
                             # uses it (.claude/hooks/devcheck.py); merge gate 7 asks for the record
start = 'ln -sf "$SHARED_REPO_PATH/.env" .env && SESSIONS_DB=$ISSUELOOPER_TMP/devcheck-$DEVCHECK_PORT.db exec uv run concierge --port $DEVCHECK_PORT'
                             # DEVCHECK_START: live mode (no CONCIERGE_SCRIPT); the app loads .env, linked from the
                             # shared checkout (git ignores it, so the tree stays clean); sessions in scratch
ready_path = "/"             # DEVCHECK_READY_PATH
command = ""                 # DEVCHECK_COMMAND: no project smoke here: ux/journeys.py starts its own server and
                             # records failed steps instead of failing, so it serves the tester's UX runs. A smoke
                             # for this key exits non-zero when a step fails and lives under ux/ (the owner's)
script_runner = "uv run python"   # DEVCHECK_SCRIPT_RUNNER: workers' Playwright scripts
slots = 2                    # DEVCHECK_SLOTS: live checks at once (each one talks to the Gemini Live API)
port_base = 8700             # DEVCHECK_PORT_BASE
paths = ["src/"]             # DEVCHECK_PATHS
labels = ["owner-request", "needs:live", "ux:accepted"]   # DEVCHECK_LABELS

[accept]
# The acceptance checklist (ids: viewport:<size>, lang:<code>, always:/live:<first three
# words>). Live-check scripts declare `# accept-rows: <ids>`, or `# accept-skip: <id> <why>`;
# gate 7 refuses a record that misses a row the PR's paths trigger. Most of cohort 52's QA
# reopens were in these rows: 320 px, Escape, half-translated Japanese, voice barge-in,
# scripted but not live.
viewports = ["1280x800", "390x844", "320x640"]
languages = ["en", "ja"]
always = ["reload mid-task and after", "keyboard: Tab, Enter, Escape", "every entry point named in the issue"]
live = ["set a location, then 'near here'", "voice and typed interruption", "a Japanese turn"]
[accept.triggers]
"src/concierge/static/*" = ["viewports", "languages"]
"src/concierge/main.py" = ["live"]

[ux]
enabled = true               # POOL_UX: a tester walks the deployed app as a user and files findings
gap_minutes = 25             # POOL_UX_GAP_MIN: at most one UX run per this many minutes
idle_gap_minutes = 10        # POOL_UX_IDLE_GAP_MIN: while no worker or merger has work, another UX run after this many minutes
journeys = "ux/journeys.py"  # POOL_UX_JOURNEYS: the project's journeys script, a path in the repository; project.md
                             # says how to run it. Empty = the tester writes and keeps its own

[spec]
enabled = true               # POOL_SPEC: while no worker or merger has work, or half of max_sessions is idle, a
                             # tester checks the app against the spec
gap_minutes = 45             # POOL_SPEC_GAP_MIN: at most one spec check per this many minutes
id_pattern = '\bR-[A-Z]+-\d+\b|\bA-\d+\b'   # POOL_MAP_ID_PATTERN: a regex for the spec's requirement ids (such as '\bREQ-\d+\b');
                             # a worker's prompt lists the files that name the ids its issue mentions

[review]
enabled = true               # REVIEW_GATE: a second model reads each diff before the merge
rules = ".issuelooper/review_rules.md"   # REVIEW_RULES: what the reviewer rejects in this project
production_paths = ["src/"]  # REVIEW_PATHS: a diff that touches none of these skips the review
fixtures = ["spec/fixtures/*.json", "ux/ux_script.json"]   # REVIEW_FIXTURES: fixture files whose values in production code are flagged for the reviewer

[pool]
max_sessions = 16            # POOL_MAX_WORKERS: agent sessions running at once, every role together
worker_timeout = "60m"       # POOL_TIMEOUT_WORKER: 60 with the live check on
merger_timeout = "45m"       # POOL_TIMEOUT_MERGER
tester_timeout = "60m"       # POOL_TIMEOUT_TESTER
# tester_port_base = 8021    # TST_PORT: the first port handed to a tester; unset, one of 8021-8099 picked by
                             # the repository's path, so loops for two repositories rarely share ports

[guard]
secret_urls = ["/api/config"]   # GUARD_SECRET_URLS: URL paths whose response holds a secret; fetching them unfiltered is refused
protected_paths = ["spec/", "ux/"]   # GUARD_PROTECTED_PATHS: the owner's files (such as ["spec/"]; a trailing / covers a
                             # directory); merge gate 6 refuses a pull request that changes any of them

# Any other variable, passed through as written.
[env]
# POOL_POLL_S = "15"
UV_FROZEN = "1"              # uv never rewrites uv.lock (an index setting on the machine would otherwise
                             # leave the shared checkout dirty, and nothing merges then)
