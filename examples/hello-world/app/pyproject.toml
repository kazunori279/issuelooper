[project]
name = "textstats"
version = "0.1.0"
description = "Count words, lines and characters in text"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
textstats = "textstats.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textstats"]
