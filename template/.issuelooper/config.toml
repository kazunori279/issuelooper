# issuelooper settings for this repository.
#
# Each key sets the environment variable named beside it, unless that variable is
# already exported (the environment wins). `python3 .claude/hooks/config.py check`
# lists what this file sets and any key it does not recognize.

[agents]
cli = "agy"                  # CCROLE_CLI: the agent CLI for every role, "agy" or "claude"
model = ""                   # CCROLE_MODEL: the model for every role; empty = the CLI's default

# One role on another CLI or model: [agents.<role>] with cli and/or model.
# Roles: worker, merger, tester, monitor, reviewer, aide.
# [agents.monitor]
# cli = "claude"
# [agents.reviewer]
# model = "..."

[monitor]
host = "herdr"               # POOL_MONITOR_HOST: "herdr" (the monitor and aides in herdr panes you talk to)
                             # or "broker" (a headless monitor reached with `issuelooper say`)

[dashboard]
enabled = true               # ISSUELOOPER_DASHBOARD: `issuelooper start` also serves the dashboard on 127.0.0.1
port = 8780                  # ISSUELOOPER_DASHBOARD_PORT: the first port tried; the next free one up to +9 is used

[sweep]
command = "make verify"      # SWEEP_COMMAND: the whole check suite, run in a worktree
slots = 4                    # SWEEP_SLOTS: sweeps that may run at the same time (the main check below runs
                             # in a lane of its own, beside these)
affected = ""                # SWEEP_AFFECTED: with the merge train on, a PR head's sweep runs this instead,
                             # with {tests} the test files the change touches (changed tests, tests importing a
                             # changed module, tests naming a changed JS/HTML/CSS file), e.g.
                             # "make lint && uv run pytest -q tests/unit {tests}". Empty = always the full sweep
affected_map = ""            # SWEEP_AFFECTED_MAP: optional file of "<glob>: <test file> ..." lines adding tests
affected_full = ""           # SWEEP_AFFECTED_FULL: globs that force the full sweep (default: conftest.py,
                             # pyproject.toml, lock files, Makefile, package.json, fixtures, .issuelooper/, .claude/)
# affected_exclude = ["tests/accept/"]   # SWEEP_AFFECTED_EXCLUDE: test dirs an affected sweep leaves out unless the
                             # change edits them (the merge train runs the acceptance guard)
# affected_browser_cap = 10  # SWEEP_AFFECTED_BROWSER_CAP: a UI change selects every browser test; over this many
                             # files, the full sweep runs instead
format = ""                  # SWEEP_FORMAT: the formatter (e.g. "uv run ruff format src tests") a worker's or
                             # merger's sweep runs first on a clean checkout; when it changes files, the sweep
                             # stops and names them, to commit and sweep again. The supervisor's sweeps never run it
rerun = ""                   # SWEEP_RERUN: reruns only the failing tests, named by {tests} (pytest node ids),
                             # for the second try of a red main check, re-sweep or merged-tree check, as in
                             # "uv run pytest -q {tests}". Empty = that second try runs the whole check again
link_files = []              # SWEEP_LINK_FILES: files linked from the shared checkout into every tree a sweep, quick
                             # check, rerun or guard runs in (workers' and the supervisor's alike), when the workers'
                             # trees get them anyway (devcheck links .env), so every check sees one environment.
                             # They must be ignored by git. Empty = none
junit = false                # SWEEP_JUNIT: a pytest suite: each pytest run in a sweep also writes a junit XML
                             # (per-test times and results) beside sweep/runs.jsonl, which records every run
fast_command = ""            # POOL_FAST_CHECK_CMD: a quick check (seconds to a minute: the app imports, the unit
                             # tests pass) run before a merge on a pull request that is behind main, merged with
                             # main, when the merge train is off; a failure hands it back. Runs in a fresh worktree, so it sets up what it needs.
                             # It runs under the merge lock, for POOL_FAST_CHECK_S (120) at most; a timeout holds
                             # the PR, and a second one on the same head hands it back. Empty = no such check
main_check = true            # POOL_MAIN_CHECK: after main moves, run the whole suite on the newest main in the
                             # background (not on a main the merge train checked); a red main files a `main is red`
                             # issue (P0), closed when it is green again

[accept]
enabled = true               # POOL_ACCEPT: with paths set, every product change gets an acceptance check
paths = []                   # ACCEPT_PATHS: product code, e.g. ["src/"]. A PR that changes it says `Refs #N`;
                             # the merge moves its issue to stage:accept, and once the deployed build (or main,
                             # when nothing deploys) has it, tester units accept batches of such issues on it,
                             # needs:live ones in live mode. Empty = off: only needs:live issues get a live check
batch = 6                    # POOL_ACCEPT_BATCH: issues one acceptance unit checks at most
units = 2                    # POOL_ACCEPT_UNITS: acceptance units side by side at most (tester sessions, counted
                             # against max_sessions); a second starts only once a full batch waits
guard = ""                   # ACCEPT_GUARD: runs tests/accept/ (e.g. "uv run pytest -q tests/accept") on each deploy,
                             # with no model; a failing test files `Regression of #N`. The scripts of verified issues
                             # become a chore issue for those tests. With the merge train, its full check runs this
                             # too, after the sweep, and a deploy of a main it checked is not guarded again. Empty = off
author = false               # POOL_AUTHOR_ACCEPT: the author's conversation, resumed, accepts its own merged issue on
                             # the deployed build (same verdict lines); off: tester units accept every issue
sample = 4                   # POOL_ACCEPT_SAMPLE: with author on, a tester who did not write it also checks owner
                             # requests, P0, and 1 in this many of the rest (0: only those two kinds)
escalate_at = 0.15           # POOL_ACCEPT_ESCALATE_AT: when more of the last `window` samples than this failed what
window = 20                  # POOL_ACCEPT_WINDOW: their author verified, the sample rate doubles (N halves, to 1)
neighbourhood_min = 10       # POOL_ACCEPT_NEIGHBOURHOOD_MIN: after a verified verdict the author looks around its change
                             # this long and files at most 3 issues (0 = off)
chore_priority = "P1"        # POOL_ACCEPT_CHORE_PRIORITY: the priority of the chore (type:chore) that turns verified
                             # scripts into tests/accept/; at P2 behind a P1 queue they sat unclaimed
guard_timeout_s = 1200       # POOL_ACCEPT_GUARD_S: the guard's time limit (the train's check: the sweep's
                             # POOL_MAIN_CHECK_S plus this)
# The acceptance checklist the worker's live check (devcheck.py, merge gate 7) and the
# tester share. Rows have ids (viewport:<size>, lang:<code>, always:<first three words>,
# live:<first three words>); a live-check script declares the rows it covers with a line
# `# accept-rows: <ids>` and skips one that cannot apply with `# accept-skip: <id> <why>`.
# Gate 7 refuses a record that misses a row the PR's paths trigger. Empty = no checklist.
viewports = []               # e.g. ["1280x800", "390x844", "320x640"]
languages = []               # e.g. ["en", "ja"]
always = []                  # e.g. ["reload mid-task and after", "keyboard: Tab, Enter, Escape"]
live = []                    # rows for a change to the live mode, e.g. ["a Japanese turn"]
no_skip = []                 # rows a live check may not skip, as ids, texts or groups (e.g. ["live:voice-and-typed"]):
                             # gate 7 refuses such a skip and points to project.md for how to run the row
# Path globs (`*` crosses /; a trailing / is a directory) and the row groups a change to
# them needs; any of them, or [accept] paths below, also needs the `always` rows.
[accept.triggers]
# "src/static/*" = ["viewports", "languages"]
# "src/live.py" = ["live"]

[deploy]
command = ""                 # POOL_DEPLOY_CMD: run from the shared checkout after main moves; empty = no deploys

[live]
enabled = false              # POOL_LIVE: needs:live issues get a tester's live check after their merge
# required_files = [".env"]  # POOL_REQUIRED_FILES: files the live environment needs in the shared checkout (default
                             # .env when live checks are on); while one is missing, the monitor and the dashboard
                             # say so and no live check starts

[devcheck]
enabled = false              # POOL_DEVCHECK: before the PR, a worker runs the app from its branch the way it runs
                             # for users (real services, credentials) and uses it (.claude/hooks/devcheck.py);
                             # merge gate 7 refuses a PR in scope without a passing record for its change
start = ""                   # DEVCHECK_START: starts the app in the real environment on $DEVCHECK_PORT, in the
                             # foreground, from a worktree; keep what it writes (databases, logs) in $ISSUELOOPER_TMP
ready_path = "/"             # DEVCHECK_READY_PATH: the app is up once this path answers with a status below 500
command = ""                 # DEVCHECK_COMMAND: the project's end-to-end smoke against $DEVCHECK_URL, run before
                             # the worker's own scripts; keep it in an owner's path (guard.protected_paths)
script_runner = "python3"    # DEVCHECK_SCRIPT_RUNNER: runs each worker script (such as "uv run python")
slots = 2                    # DEVCHECK_SLOTS: checks that may run at the same time (each one uses the real services)
port_base = 8700             # DEVCHECK_PORT_BASE: slot k serves on port_base + k
paths = ["src/"]             # DEVCHECK_PATHS: a PR that changes any of these needs a live check
labels = ["owner-request", "needs:live", "ux:accepted"]   # DEVCHECK_LABELS: so does a PR for an issue with one

[ux]
enabled = false              # POOL_UX: a tester walks the deployed app as a user and files findings
gap_minutes = 25             # POOL_UX_GAP_MIN: at most one UX run per this many minutes
idle_gap_minutes = 10        # POOL_UX_IDLE_GAP_MIN: while no worker or merger has work, another UX run after this many minutes
journeys = ""                # POOL_UX_JOURNEYS: the project's journeys script, a path in the repository (such as
                             # "ux/journeys.py"; project.md says how to run it); empty = the tester writes and keeps
                             # its own in $ISSUELOOPER_TMP/ux/

[spec]
enabled = false              # POOL_SPEC: while no worker or merger has work, or half of max_sessions is idle, a
                             # tester checks the app against the spec
gap_minutes = 45             # POOL_SPEC_GAP_MIN: at most one spec check per this many minutes
id_pattern = ""              # POOL_MAP_ID_PATTERN: a regex for the spec's requirement ids (such as '\bREQ-\d+\b');
                             # a worker's prompt lists the files that name the ids its issue mentions

[review]
enabled = true               # REVIEW_GATE: a second model reads each diff before the merge
rules = ".issuelooper/review_rules.md"   # REVIEW_RULES: what the reviewer rejects in this project
production_paths = ["src/"]  # REVIEW_PATHS: a diff that touches none of these skips the review
spec_paths = ["spec/"]       # REVIEW_SPEC_PATHS: where the spec is; names the diff adds that it names (test hooks,
                             # ids, keys) are listed for the reviewer as the product's, never test-specific. [] = off
max_rejects = 2              # REVIEW_MAX_REJECTS: rejects handed back to workers; the next one waits for the owner
# fixtures = ["tests/fixtures/**/*.json"]   # REVIEW_FIXTURES: fixture files whose values in production code are flagged for the reviewer

[pool]
max_sessions = 8             # POOL_MAX_WORKERS: agent sessions running at once, every role together
# worker_timeout = "45m"     # POOL_TIMEOUT_WORKER: default 45m, or 60m with [devcheck] on
merger_timeout = "45m"       # POOL_TIMEOUT_MERGER
tester_timeout = "60m"       # POOL_TIMEOUT_TESTER
merge_train = true           # POOL_MERGE_TRAIN: PRs that pass the gates wait in a queue; one run of the whole
                             # suite on main with a batch of them merged decides the batch and is main's check.
                             # Off (or no [sweep] command): each PR merges on its own after the quick check
train_size = 6               # POOL_TRAIN_SIZE: PRs in one train at most (it takes what is queued, up to this)
# tester_port_base = 8021    # TST_PORT: the first port handed to a tester; unset, one of 8021-8099 picked by
                             # the repository's path, so loops for two repositories rarely share ports
author_resolve = false       # POOL_AUTHOR_RESOLVE: a PR that conflicts after the supervisor's rebase (or whose rebase
                             # is red) is resolved by its author's conversation, resumed (agy --conversation, claude
                             # --resume), instead of a merger session; the merger stays the fallback (no recorded
                             # conversation, or POOL_AUTHOR_RESOLVE_MAX = 2 author sessions without a merge)
starve_overlap = true        # POOL_STARVE_OVERLAP: while a P0/P1 PR starves (its rebase left to a merger twice on
                             # the same files), hold only merges whose hunks there come within 10 lines of its own
                             # (POOL_STARVE_MARGIN); off: every merge that touches those files waits
starve_hold_s = 3600         # POOL_STARVE_HOLD_S: the longest one starving PR holds others
prune_other_roots = false    # POOL_PRUNE_OTHER_ROOTS: at start, also remove other loops' scratch roots beside this
                             # one (issuelooper-*-<hash>) untouched for two days; off: only this repository's

[guard]
secret_urls = []             # GUARD_SECRET_URLS: URL paths whose response holds a secret; fetching them unfiltered is refused
protected_paths = []         # GUARD_PROTECTED_PATHS: the owner's files (such as ["spec/"]; a trailing / covers a
                             # directory); merge gate 6 refuses a pull request that changes any of them
background_check = true      # GUARD_BACKGROUND: refuse `cmd &` (or nohup, setsid -f) that does not redirect stdout,
                             # stderr and stdin (`> log 2>&1 < /dev/null`): the agent CLI waits for them to close

# Any other variable, passed through as written.
[env]
# POOL_POLL_S = "15"
